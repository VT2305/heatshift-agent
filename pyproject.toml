[project]
name = "heatshift-agent"
version = "0.1.0"
description = "HeatShift climate-adaptive workforce orchestration agent"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "ortools>=9.10",
]

[project.optional-dependencies]
aws = [
  "strands-agents>=1.0.0",
  "bedrock-agentcore",
  "strands-agents",
  "boto3",
  "aws-opentelemetry-distro",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["heatshift*"]
exclude = ["data*", "rules*", "tests*", "docs*"]
